<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rota & Café{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-coffee">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">Rota & Café</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('cafeterias') }}">Cafeterias</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('agenda') }}">Agenda</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('sobre') }}">Sobre</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer class="py-4 text-center text-secondary">Rota & Café · guia independente de cafeterias</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
